name: worker-docker

on:
  pull_request:
    paths:
      - worker/**
      - tests/test_worker_*.py
      - .github/workflows/docker-worker.yml
  workflow_dispatch:
    inputs:
      publish:
        description: "Push image to GHCR"
        required: true
        type: boolean
        default: false
      dockerfile:
        description: "Dockerfile path to build (for example worker/Dockerfile.blackwell)"
        required: true
        type: string
        default: "worker/Dockerfile"
      expected_torch_version:
        description: "Expected public torch version in image"
        required: true
        type: string
        default: "2.14.1"
      expected_torchvision_version:
        description: "Expected public torchvision version in image"
        required: true
        type: string
        default: "0.29.1"
      expected_cuda_version:
        description: "Expected torch compiled CUDA version in image"
        required: true
        type: string
        default: "13.0"
      expected_arch_token:
        description: "Expected torch CUDA arch token (for example sm_120)"
        required: true
        type: string
        default: "sm_120"
      publish_tag:
        description: "Optional additional GHCR tag (e.g. blackwell-test)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          python -m ruff check .

      - name: Pytest
        run: |
          python -m pytest

  build-smoke:
    runs-on: ubuntu-latest
    needs: quality
    env:
      IMAGE_NAME: vast-video-upscaler-worker:ci-smoke
      MIN_FREE_GB: "30"
      DOCKERFILE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.dockerfile || 'worker/Dockerfile' }}
      EXPECTED_TORCH_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_torch_version || '2.14.1' }}
      EXPECTED_TORCHVISION_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_torchvision_version || '0.29.1' }}
      EXPECTED_CUDA_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_cuda_version || '13.0' }}
      EXPECTED_ARCH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_arch_token || 'sm_120' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disk diagnostics (before cleanup)
        run: |
          set -euo pipefail
          echo "== df -h =="
          df -h
          echo "== df -i =="
          df -i
          echo "== docker system df (before) =="
          docker system df || true
          echo "== top runner directories =="
          sudo du -sh /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true

      - name: Free runner disk space (safe cleanup for this job)
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /tmp/* || true

      - name: Disk diagnostics (after cleanup)
        run: |
          set -euo pipefail
          echo "== df -h =="
          df -h
          echo "== docker system df (after cleanup) =="
          docker system df || true

      - name: "Guardrail: fail early if free space is too low"
        run: |
          set -euo pipefail
          FREE_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free space on /: ${FREE_GB} GB"
          if [ "${FREE_GB}" -lt "${MIN_FREE_GB}" ]; then
            echo "Insufficient disk space before Docker build: ${FREE_GB} GB available, ${MIN_FREE_GB} GB required." >&2
            exit 1
          fi

      - name: Build worker image (no push)
        run: |
          set -euo pipefail
          docker build --file "$DOCKERFILE_PATH" --tag "$IMAGE_NAME" .

      - name: Disk diagnostics (after build)
        run: |
          set -euo pipefail
          echo "== df -h =="
          df -h
          echo "== docker system df (after build) =="
          docker system df || true
          echo "== image history =="
          docker history --no-trunc "$IMAGE_NAME" || true

      - name: Smoke run (entrypoint --help)
        run: |
          docker run --rm $IMAGE_NAME --help

      - name: Verify documented args are accepted
        run: |
          docker run --rm $IMAGE_NAME --help --input /workspace/input/source.mkv --output /workspace/output/result.mkv --target-width 1920 --target-height 1080 --profile balanced

      - name: Verify FFmpeg and ffprobe
        run: |
          docker run --rm --entrypoint bash $IMAGE_NAME -lc "set -euo pipefail; ffmpeg -version | head -n 1; ffprobe -version | head -n 1"

      - name: Verify AI runtime imports and versions
        id: runtime-info
        run: |
          docker run --rm --entrypoint python $IMAGE_NAME -c "import torch, torchvision, realesrgan, basicsr, cv2; print('torch=' + torch.__version__); print('torchvision=' + torchvision.__version__); print('realesrgan=' + realesrgan.__version__); print('basicsr=' + basicsr.__version__); print('opencv=' + cv2.__version__); print('torch_cuda_compiled=' + str(torch.version.cuda)); print('cudnn_compiled=' + str(torch.backends.cudnn.version())); print('cuda_available_runtime=' + str(torch.cuda.is_available()))" | tee runtime-info.txt

      - name: Verify BasicSR and Real-ESRGAN import path compatibility
        run: |
          docker run --rm --entrypoint python $IMAGE_NAME -c "import basicsr.data.degradations; from basicsr.data.degradations import rgb_to_grayscale; from basicsr.archs.rrdbnet_arch import RRDBNet; from realesrgan import RealESRGANer; print('imports_ok')"

      - name: Verify staged temporary output path keeps container extension
        run: |
          docker run --rm --entrypoint python $IMAGE_NAME -c "from pathlib import Path; from process import _build_staged_output_path; p = _build_staged_output_path(Path('/workspace/output/test-upscaled.mp4')); assert p.name == 'test-upscaled.tmp.mp4', p; q = _build_staged_output_path(Path('/workspace/output/test-upscaled.mkv')); assert q.name == 'test-upscaled.tmp.mkv', q; print('temp_path_ok')"

      - name: Verify CPU ffmpeg short encode and ffprobe
        run: |
          docker run --rm --entrypoint bash $IMAGE_NAME -lc "set -euo pipefail; TMPDIR=\$(mktemp -d); ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x180:rate=24 -t 1 -c:v libx264 -pix_fmt yuv420p \$TMPDIR/src.mp4; ffmpeg -hide_banner -loglevel error -y -i \$TMPDIR/src.mp4 -c:v libx265 -an \$TMPDIR/out.mp4; ffprobe -hide_banner -loglevel error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 \$TMPDIR/out.mp4 | tee \$TMPDIR/ffprobe.txt; grep -q 'codec_name=hevc' \$TMPDIR/ffprobe.txt; grep -q 'width=320' \$TMPDIR/ffprobe.txt; grep -q 'height=180' \$TMPDIR/ffprobe.txt"

      - name: Verify pinned torch/cuda compatibility
        run: |
          docker run --rm --entrypoint python $IMAGE_NAME -c "import importlib.util, torch, torchvision; assert importlib.util.find_spec('packaging') is not None, 'packaging is required for version checks'; from packaging.version import Version; expected_torch_release = Version('${EXPECTED_TORCH_VERSION}').release; detected_torch_release = Version(torch.__version__).release; expected_torchvision_release = Version('${EXPECTED_TORCHVISION_VERSION}').release; detected_torchvision_release = Version(torchvision.__version__).release; expected_cuda_release = Version('${EXPECTED_CUDA_VERSION}').release; detected_cuda_release = Version(str(torch.version.cuda)).release; print(f'[compat] torch expected={expected_torch_release} detected={detected_torch_release} ({torch.__version__})'); print(f'[compat] torchvision expected={expected_torchvision_release} detected={detected_torchvision_release} ({torchvision.__version__})'); print(f'[compat] cuda expected_release={expected_cuda_release} detected_release={detected_cuda_release} ({torch.version.cuda})'); assert detected_torch_release == expected_torch_release, f'unexpected torch public version: expected {expected_torch_release}, detected {detected_torch_release} ({torch.__version__})'; assert detected_torchvision_release == expected_torchvision_release, f'unexpected torchvision public version: expected {expected_torchvision_release}, detected {detected_torchvision_release} ({torchvision.__version__})'; assert tuple(detected_cuda_release) == tuple(expected_cuda_release), f'unexpected compiled cuda version release: expected {expected_cuda_release}, detected {detected_cuda_release} ({torch.version.cuda})'"

      - name: Verify compiled CUDA arch token support
        run: |
          docker run --rm --entrypoint python $IMAGE_NAME -c "import torch; expected='${EXPECTED_ARCH_TOKEN}'.strip(); arch=[str(item) for item in torch.cuda.get_arch_list()]; print(f'[compat] expected_arch_token={expected} arch_list={arch}'); alt='compute_' + expected[3:] if expected.startswith('sm_') else None; assert (expected in arch) or (alt is not None and alt in arch), f'expected arch token {expected} not present in torch arch list {arch}'"

      - name: Verify model file integrity in image
        run: |
          docker run --rm --entrypoint bash $IMAGE_NAME -lc "set -euo pipefail; echo '4fa0d38905f75ac06eb49a7951b426670021be3018265fd191d2125df9d682f1  /opt/models/RealESRGAN_x4plus.pth' | sha256sum -c -"

      - name: Verify no obvious secrets in image env
        run: |
          if docker inspect $IMAGE_NAME --format '{{json .Config.Env}}' | grep -E 'VAST_API_KEY|VAST_SSH_PRIVATE_KEY|SECRET|TOKEN|PASSWORD'; then
            echo "Potential secret-like env var detected in image config" >&2
            exit 1
          fi

      - name: Collect image size
        id: image-size
        run: |
          SIZE_BYTES=$(docker image inspect $IMAGE_NAME --format '{{.Size}}')
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", ${SIZE_BYTES}/1024/1024}")
          echo "size_bytes=${SIZE_BYTES}" >> "$GITHUB_OUTPUT"
          echo "size_mb=${SIZE_MB}" >> "$GITHUB_OUTPUT"

      - name: Build report summary
        run: |
          {
            echo "## Worker Docker validation";
            echo "- Ruff: passed";
            echo "- Pytest: passed";
            echo "- Docker build (linux/amd64): passed";
            echo "- Dockerfile: ${DOCKERFILE_PATH}";
            echo "- Runner disk guardrail: passed (>= $MIN_FREE_GB GB before build)";
            echo "- Entrypoint --help: passed";
            echo "- FFmpeg/ffprobe: passed";
            echo "- AI imports: passed";
            echo "- BasicSR/Real-ESRGAN targeted imports: passed";
            echo "- Temp output path (.tmp.<ext>): passed";
            echo "- CPU ffmpeg short encode + ffprobe: passed";
            echo "- Runtime versions:";
            sed 's/^/  - /' runtime-info.txt;
            echo "- CUDA arch token check: ${EXPECTED_ARCH_TOKEN} present in torch.cuda.get_arch_list()";
            echo "- Model SHA256 check: passed";
            echo "- Image size: ${{ steps.image-size.outputs.size_mb }} MB (${{ steps.image-size.outputs.size_bytes }} bytes)";
            echo "- Note: GPU runtime compatibility and CUDA inference are NOT validated by this workflow.";
          } >> "$GITHUB_STEP_SUMMARY"

  publish-ghcr:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    needs: build-smoke
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="${{ github.repository_owner }}"
          OWNER_LC="${OWNER_LC,,}"
          IMAGE="ghcr.io/${OWNER_LC}/vast-video-upscaler-worker"
          TAGS="${IMAGE}:dev-sha-${GITHUB_SHA::12}"
          EXTRA_TAG="${{ inputs.publish_tag }}"
          if [ -n "${EXTRA_TAG}" ]; then
            TAGS="${TAGS},${IMAGE}:${EXTRA_TAG}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
