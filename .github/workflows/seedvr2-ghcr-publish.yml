name: seedvr2-ghcr-publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKERFILE_PATH: prototype/seedvr2/Dockerfile
  IMAGE_REPO: ghcr.io/davbg67/vast-video-upscaler-seedvr2

jobs:
  publish-experimental:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare immutable image reference
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="exp-6a2-${GITHUB_SHA}"
          IMAGE_REF="${IMAGE_REPO}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Guardrails (Dockerfile + tag policy)
        shell: bash
        run: |
          set -euo pipefail
          test "$DOCKERFILE_PATH" = "prototype/seedvr2/Dockerfile"
          test -f "$DOCKERFILE_PATH"
          IMAGE_REF="${{ steps.prepare.outputs.image_ref }}"
          IMAGE_TAG="${{ steps.prepare.outputs.image_tag }}"
          if [ "${IMAGE_REPO}" != "ghcr.io/davbg67/vast-video-upscaler-seedvr2" ]; then
            echo "Unexpected image repository: ${IMAGE_REPO}" >&2
            exit 1
          fi
          if [[ "${IMAGE_TAG}" == "latest" ]]; then
            echo "Publishing latest is forbidden for SeedVR2 experimental image." >&2
            exit 1
          fi
          if [[ "${IMAGE_REF}" == ghcr.io/davbg67/vast-video-upscaler-worker:* ]]; then
            echo "Publishing to stable Real-ESRGAN repository is forbidden." >&2
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SeedVR2 image before publish
        shell: bash
        run: |
          set -euo pipefail
          docker build --file "$DOCKERFILE_PATH" --tag "${{ steps.prepare.outputs.image_ref }}" .
          docker image inspect "${{ steps.prepare.outputs.image_ref }}" >/dev/null

      - name: Smoke run SeedVR2 CLI help
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "${{ steps.prepare.outputs.image_ref }}" --help | tee /tmp/seedvr2-runner-help.txt
          grep -q -- '--input-is-excerpt' /tmp/seedvr2-runner-help.txt

      - name: Push experimental image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.prepare.outputs.image_ref }}"

      - name: Verify published image exists
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ steps.prepare.outputs.image_ref }}" > /tmp/seedvr2-imagetools.txt
          grep -q "Name:.*${{ steps.prepare.outputs.image_ref }}" /tmp/seedvr2-imagetools.txt

      - name: Workflow summary
        shell: bash
        run: |
          {
            echo "## SeedVR2 GHCR experimental publish";
            echo "- Dockerfile: \`$DOCKERFILE_PATH\`";
            echo "- Published image: \`${{ steps.prepare.outputs.image_ref }}\`";
            echo "- Tag policy: immutable \`exp-6a2-\$GITHUB_SHA\`";
            echo "- Push to \`latest\`: not performed";
            echo "- Push to stable Real-ESRGAN image: not performed";
            echo "- GPU inference: not executed";
          } >> "$GITHUB_STEP_SUMMARY"
